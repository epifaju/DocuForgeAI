# Production override — HTTPS / Traefik (U0)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile antivirus --profile proxy up -d
#
# Retire les ports hôte (entrée via Traefik 80/443).
# Pour un self-host Windows / LAN sans Traefik, utiliser plutôt :
#   docker compose -f docker-compose.yml -f docker-compose.selfhost.yml up -d
#   (voir DEPLOYMENT_WINDOWS.md)
#
# Prerequisites: strong secrets (scripts/secure-env.ps1 -Prod), first admin already created
# (or temporarily set DOCUFORGE_BOOTSTRAP_ENABLED=true for the very first boot only).

services:
  postgres:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      SPRING_PROFILES_ACTIVE: docker,prod
      DOCUFORGE_BOOTSTRAP_ENABLED: ${DOCUFORGE_BOOTSTRAP_ENABLED:-false}
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}

  frontend:
    ports: !reset []

  mailpit:
    ports: !reset []

  ollama:
    ports: !reset []
